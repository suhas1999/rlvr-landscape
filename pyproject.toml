[project]
name = "rlvr-landscape"
version = "0.1.0"
description = "Reward landscapes of RLVR-trained language models"
requires-python = ">=3.11,<3.13"
dependencies = [
    # torch 2.13 / CUDA 13: needs an NVIDIA driver >= 580 on the GPU box
    "vllm==0.31.0",
    "transformers>=5.10.4,<5.18",
    "numpy",
    "pandas",
    "matplotlib",
    "sympy",
    "pylatexenc",
    "tqdm",
    "huggingface_hub[cli]",
    "wandb",
]

[tool.uv]
# vLLM only ships Linux x86_64 CUDA wheels; resolve the lock for the GPU box only.
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
